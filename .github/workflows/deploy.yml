name: Deploy to GitHub Pages

on:
  # Publish whenever the default branch changes — editing a .md or .json file
  # through the GitHub web UI is enough to trigger a rebuild and redeploy.
  push:
    branches: [main]
  # …and allow a manual run from the Actions tab.
  workflow_dispatch:

# Required for the deploy-pages action to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys run at once, but do not cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check content and components
        # Catches a mistyped field in a .json or .md file before it ships.
        run: npm run check

      - name: Build
        env:
          # Served from its own domain, app-appraisal.com (set in Settings →
          # Pages → Custom domain; public/CNAME records the same name). `base`
          # prefixes every stylesheet, script and link, so it must match where
          # the site is served — getting it wrong is the classic "the page loads
          # but has no CSS" on GitHub Pages.
          #
          # They are pinned rather than read from `configure-pages` so the
          # published URLs are never a surprise: canonical tags, the sitemap
          # and og:url all come from SITE_URL.
          SITE_URL: https://app-appraisal.com
          SITE_BASE: /
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # Since v4 dotfiles are dropped by default; keep public/.nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
