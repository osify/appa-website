name: Deploy to GitHub Pages

on:
  # Publish whenever the default branch changes — editing a .md or .json file
  # through the GitHub web UI is enough to trigger a rebuild and redeploy.
  push:
    branches: [main]
  # …and allow a manual run from the Actions tab.
  workflow_dispatch:

# Required for the deploy-pages action to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys run at once, but do not cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check content and components
        # Catches a mistyped field in a .json or .md file before it ships.
        run: npm run check

      - name: Build
        env:
          # ── INTERIM: project-site URLs ────────────────────────────────────
          # The site is destined for its own domain (see public/CNAME), but
          # app-appraisal.com still points at the previous host, so for now it
          # is served from the project site and these two values must match
          # that: `base` is what prefixes every stylesheet, script and link,
          # and getting it wrong is the classic "the page loads but has no
          # CSS" on GitHub Pages.
          #
          # AT CUTOVER — when app-appraisal.com's DNS is moved to GitHub and
          # the domain is entered in Settings → Pages — change these two lines
          # back together, and nothing else needs editing:
          #
          #     SITE_URL: https://app-appraisal.com
          #     SITE_BASE: /
          #
          # They are pinned rather than read from `configure-pages` so the
          # published URLs are never a surprise: canonical tags, the sitemap
          # and og:url all come from SITE_URL.
          SITE_URL: https://osify.github.io
          SITE_BASE: /appa-website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
